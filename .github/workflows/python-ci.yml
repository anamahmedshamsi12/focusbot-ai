name: Python CI

# Runs on every push to main and on every pull request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up the Python version
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install system libraries PyAudio needs to build on Linux
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      # 4. Install the project's runtime + dev dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # 5. Run all tests with coverage reporting
      - name: Run tests
        run: |
          pytest tests/ --cov=alfred --cov-report=term-missing
